# Stack della Backup Console. Nessuna porta esposta: il traffico arriva dall'nginx di
# bordo (edge/) attraverso la rete Docker condivisa "proxy".
#
#   docker compose --env-file .env up -d
name: backup-console

x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/stefanozanarini/backup-console-backend:${BC_VERSION:?imposta BC_VERSION}}
  build: ../backend
  restart: unless-stopped
  environment:
    BC_DATABASE_URL: postgresql+asyncpg://bc:${POSTGRES_PASSWORD}@db:5432/bc
    BC_CA_DIR: /data/ca
    BC_AUTH_MODE: ${BC_AUTH_MODE:-oidc}
    BC_LOCAL_LOGIN: ${BC_LOCAL_LOGIN:-false}
    BC_OIDC_ISSUER: ${BC_OIDC_ISSUER:-}
    BC_OIDC_AUDIENCE: ${BC_OIDC_AUDIENCE:-}
    BC_OIDC_JWKS_URL: ${BC_OIDC_JWKS_URL:-}
    BC_OIDC_SPA_CLIENT_ID: ${BC_OIDC_SPA_CLIENT_ID:-}
    BC_OIDC_AUTHORITY: ${BC_OIDC_AUTHORITY:-}
    BC_OIDC_SCOPE: ${BC_OIDC_SCOPE:-}
    BC_RELEASE_PUBLIC_KEY: ${BC_RELEASE_PUBLIC_KEY:-}
    BC_RETENTION_METRICS_RAW_DAYS: ${BC_RETENTION_METRICS_RAW_DAYS:-90}
    BC_RETENTION_METRICS_DAYS: ${BC_RETENTION_METRICS_DAYS:-730}
    BC_RETENTION_INVENTORY_FULL_DAYS: ${BC_RETENTION_INVENTORY_FULL_DAYS:-7}
    BC_RETENTION_INVENTORY_DAYS: ${BC_RETENTION_INVENTORY_DAYS:-365}
    BC_RETENTION_EVENTS_DAYS: ${BC_RETENTION_EVENTS_DAYS:-90}
    BC_RETENTION_HISTORY_DAYS: ${BC_RETENTION_HISTORY_DAYS:-730}
    BC_AGENTS_URL: ${BC_PUBLIC_URL:?imposta BC_PUBLIC_URL}
    BC_PROXY_SECRET: ${BC_PROXY_SECRET:?imposta BC_PROXY_SECRET (stesso valore dello stack edge)}
  volumes:
    # Dati persistenti in directory dell'host (BC_DATA_DIR), non in volumi Docker.
    # La CA degli agenti è montata in sola lettura anche dall'nginx di bordo, per
    # verificare i certificati client (legge solo agent-ca.crt).
    - ${BC_DATA_DIR:?imposta BC_DATA_DIR}/ca:/data/ca
    - ${BC_DATA_DIR}/releases:/data/releases
  networks: [internal]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}
      POSTGRES_DB: bc
    volumes:
      - ${BC_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bc -d bc"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  # Migrazioni + creazione CA agenti e chiave dei segreti, poi termina.
  init:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "app.cli", "init"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      internal: {}
      # Nome univoco sulla rete condivisa con le altre applicazioni della VM.
      proxy: { aliases: [backup-console-api] }

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      init: { condition: service_completed_successfully }

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/stefanozanarini/backup-console-frontend:${BC_VERSION:?imposta BC_VERSION}}
    build: ../frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      proxy: { aliases: [backup-console-web] }

networks:
  internal:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
