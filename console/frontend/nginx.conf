# Server dei file statici del frontend (dentro lo stack della console, porta 8080).
# TLS, HSTS e l'instradamento di /api e /agent li gestisce l'nginx di bordo (edge/).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # add_header non si eredita nelle location che ne definiscono altri: stesse
    # intestazioni ripetute tramite include.
    include /etc/nginx/snippets/security-headers.conf;

    # Asset con hash nel nome: cache lunga.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: tutte le rotte finiscono su index.html, sempre rivalidato.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
