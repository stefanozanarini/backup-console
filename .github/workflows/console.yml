name: console

# Immagini pubblicate su GHCR:
#   push su main                → :main e :<sha>   (per provare, non per la produzione)
#   tag console-backup-vX.Y.Z   → :X.Y.Z e :latest (versione da mettere in BC_VERSION sulla VM)
on:
  push:
    branches: [main]
    tags: ["console-backup-v*"]
    paths: ["console/**", ".github/workflows/console.yml"]
  pull_request:
    paths: ["console/**", ".github/workflows/console.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bc
          POSTGRES_PASSWORD: bc
          POSTGRES_DB: bc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bc" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: console/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
        env:
          BC_TEST_DATABASE_URL: postgresql+asyncpg://bc:bc@localhost:5432/bc_test
      - name: Migrazioni allineate ai modelli
        env:
          BC_DATABASE_URL: postgresql+asyncpg://bc:bc@localhost:5432/bc_test
        run: |
          psql postgresql://bc:bc@localhost:5432/bc_test -c "drop schema public cascade; create schema public;"
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/console-backup-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Versione e tag
        id: v
        run: |
          OWNER="ghcr.io/${{ github.repository_owner }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME#console-backup-v}"
            TAGS="$VERSION latest"
          else
            VERSION="main-${GITHUB_SHA::8}"
            TAGS="main ${GITHUB_SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          for img in backend frontend; do
            list=""
            for t in $TAGS; do list="${list}${OWNER}/backup-console-${img}:${t},"; done
            echo "${img}=${list%,}" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: console/backend
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.backend }}
      - uses: docker/build-push-action@v6
        with:
          context: console/frontend
          push: true
          tags: ${{ steps.v.outputs.frontend }}
