name: agent

on:
  push:
    branches: [main]
    tags: ["agent-v*"]
    paths: ["agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: linux-amd64 }   # QNAP x86_64
          - { goos: linux, goarch: arm64, name: linux-arm64 }   # QNAP ARM64 (AL-324, ...)
          - { goos: linux, goarch: arm, goarm: "7", name: linux-armv7 }  # QNAP ARMv7 (AL-212/314, ...)
          - { goos: windows, goarch: amd64, name: windows-amd64 }  # server Veeam e PC
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          # Chiave pubblica di verifica degli aggiornamenti (variabile di repository,
          # non segreta): senza, l'agente rifiuta gli aggiornamenti remoti.
          RELEASE_PUBLIC_KEY: ${{ vars.AGENT_RELEASE_PUBLIC_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          [ "${GITHUB_REF_TYPE}" = tag ] || VERSION="0.0.0-${GITHUB_SHA::8}"
          EXT="" TAGS=""
          LDFLAGS="-s -w -X backupconsole/agent/internal/version.Version=${VERSION}"
          if [ "$GOOS" = windows ]; then
            EXT=".exe" TAGS="embedtray"
            # Icona nella tray: programma grafico (niente console) incluso in bc-agent.exe.
            go build -trimpath -ldflags "$LDFLAGS -H windowsgui" -o internal/trayembed/bin/bc-agent-tray.exe ./cmd/bc-agent-tray
          fi
          mkdir -p dist
          go build -tags "$TAGS" -trimpath -ldflags "$LDFLAGS -X backupconsole/agent/internal/upgrade.PublicKey=${RELEASE_PUBLIC_KEY}" \
            -o "dist/bc-agent-${{ matrix.name }}${EXT}" ./cmd/bc-agent
      - uses: actions/upload-artifact@v4
        with:
          name: bc-agent-${{ matrix.name }}
          path: agent/dist/*

  qpkg:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bc-agent-linux-*
          path: bin
          merge-multiple: true
      - name: Build QPKG (QDK)
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          [ "${GITHUB_REF_TYPE}" = tag ] || VERSION="0.0.0.${GITHUB_RUN_NUMBER}"
          packaging/qpkg/build.sh "$VERSION" bin dist/qpkg
      - uses: actions/upload-artifact@v4
        with:
          name: qpkg
          path: dist/qpkg/*

  # Solo sui tag agent-vX.Y.Z: firma Ed25519 dei binari e GitHub Release con
  # binari + manifest.json da caricare in console (Aggiornamenti agente).
  release:
    if: github.ref_type == 'tag'
    needs: [build, qpkg]
    runs-on: ubuntu-latest
    environment: agent-release  # Environment protetto: approvazione manuale prima della firma
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Firma dei binari
        env:
          BC_RELEASE_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          mkdir -p release
          cp artifacts/bc-agent-*/bc-agent-* artifacts/qpkg/*.qpkg release/
          cd agent && go run ./cmd/bc-release sign -version "$VERSION" ../release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
      # Caricamento automatico in console (Aggiornamenti agente). Servono la variabile
      # CONSOLE_URL e il secret CONSOLE_RELEASE_TOKEN (chiave API con scope
      # releases:upload); senza, il passo viene saltato. Gli agenti NON vengono
      # aggiornati: il rollout resta un'azione manuale in console.
      - name: Carica il rilascio in console
        if: vars.CONSOLE_URL != ''
        env:
          CONSOLE_URL: ${{ vars.CONSOLE_URL }}
          TOKEN: ${{ secrets.CONSOLE_RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CONSOLE_RELEASE_TOKEN non impostato: caricamento in console saltato"; exit 0
          fi
          args=(-F "manifest=@release/manifest.json" -F "notes=${GITHUB_REF_NAME} (CI)")
          for f in release/bc-agent-* release/*.qpkg; do args+=(-F "files=@$f"); done
          code=$(curl -sS -o resp.json -w '%{http_code}' --retry 3 --retry-all-errors --max-time 900 \
            -H "Authorization: Bearer $TOKEN" "${args[@]}" "$CONSOLE_URL/api/v1/releases")
          cat resp.json; echo
          case "$code" in
            201) echo "rilascio caricato in console" ;;
            409) echo "::notice::versione già presente in console" ;;
            *) echo "::error::caricamento in console non riuscito (HTTP $code)"; exit 1 ;;
          esac
      # TODO: firma Authenticode dell'exe Windows (Azure Trusted Signing) e MSI.
