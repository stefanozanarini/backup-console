# Proxy verso l'api per gli endpoint degli agenti, con l'esito della verifica mTLS.
include snippets/proxy.conf;
# Sempre sovrascritti: un client non può iniettarli.
proxy_set_header X-Client-Verify $ssl_client_verify;
proxy_set_header X-Client-Cert   $ssl_client_escaped_cert;
# Prova per l'api che la richiesta arriva da qui (vedi BC_PROXY_SECRET).
proxy_set_header X-Proxy-Secret  $bc_proxy_secret;
# Long-poll dei comandi (il server attende fino a 25 s) e download dei binari.
proxy_read_timeout 90s;
proxy_buffering off;
client_max_body_size 20m;
proxy_pass $bc_api;
